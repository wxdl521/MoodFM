spring:
  application:
    name: moodfm-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Virtual Threads (Java 21)
  threads:
    virtual:
      enabled: true

  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:moodfm}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true   # 已存在的库直接 baseline，不报错
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2

  cache:
    type: caffeine
    # TTL per cache is configured in CacheConfig.java (users=10min, songs/platformMappings=1h)

  ai:
    openai:
      base-url: ${LLM_BASE_URL:https://api.deepseek.com}
      api-key: ${LLM_API_KEY:}
      chat:
        options:
          model: ${LLM_MODEL:deepseek-chat}
          temperature: 0.3

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /docs
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

moodfm:
  upload-dir: ${UPLOAD_DIR:${user.home}/moodfm-uploads}

app:
  music-adapter:
    url: ${MUSIC_ADAPTER_URL:http://localhost:3000}
    secret: ${ADAPTER_SECRET:}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expire-ms: 1800000    # 30 分钟
    refresh-token-expire-ms: 604800000 # 7 天
    remember-me-expire-ms: 2592000000  # 30 天
  cookie-encryption:
    key: ${COOKIE_ENCRYPTION_KEY:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

zhipu:
  embedding:
    api-key: ${AI_EMBEDDING_API_KEY:}
    model: ${AI_EMBEDDING_MODEL:embedding-3}

qdrant:
  host: ${QDRANT_HOST:localhost}
  port: ${QDRANT_PORT:6334}
  use-tls: ${QDRANT_USE_TLS:false}

server:
  port: 8081
