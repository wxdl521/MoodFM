<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MoodFM · 心绪电台 — Frontend Design</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    html, body { width: 100%; height: 100%; }
    body { background: #0c0a08; font-family: 'Noto Serif SC', serif; }
    .canvas-host { position: fixed; inset: 0; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root" class="canvas-host"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="atoms.jsx"></script>
  <script type="text/babel" src="screens/landing.jsx"></script>
  <script type="text/babel" src="screens/auth.jsx"></script>
  <script type="text/babel" src="screens/onboarding.jsx"></script>
  <script type="text/babel" src="screens/bind.jsx"></script>
  <script type="text/babel" src="screens/home.jsx"></script>
  <script type="text/babel" src="screens/player.jsx"></script>
  <script type="text/babel" src="screens/insights.jsx"></script>
  <script type="text/babel" src="screens/calendar.jsx"></script>
  <script type="text/babel" src="screens/weekly.jsx"></script>
  <script type="text/babel" src="screens/playlist.jsx"></script>

  <script type="text/babel" data-presets="react">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "theme": "dark",
      "mood": "dusk",
      "wheelGeometry": "blob"
    }/*EDITMODE-END*/;

    function App() {
      const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const { theme, mood, wheelGeometry } = tweaks;

      // simple cross-screen nav (in case any artboard uses it)
      const goTo = (label) => {
        const el = document.querySelector(`[data-screen-label="${label}"]`);
        if (el) el.scrollIntoView({ block:'center', inline:'center' });
      };

      const sharedProps = { theme, mood, wheelGeometry };

      return (
        <>
          <DesignCanvas
            title="MoodFM · 心绪电台"
            subtitle="Editorial × Emotional Spectrum — Onboarding + 4 core screens / desktop + mobile"
          >
            <DCSection id="landing" title="P1 · 落地页 / Landing">
              <DCArtboard id="landing-d" label="Desktop · 1440 × 900" width={1440} height={900}>
                <Landing device="desktop" {...sharedProps} onEnter={()=>goTo('02b Login')}/>
              </DCArtboard>
              <DCArtboard id="landing-m" label="Mobile · 390 × 844" width={390} height={844}>
                <Landing device="mobile" {...sharedProps} onEnter={()=>goTo('02b Login')}/>
              </DCArtboard>
            </DCSection>

            <DCSection id="auth" title="P3 · 登录 / Login — 编辑式分屏 · 双联画">
              <DCArtboard id="login-d" label="Desktop · 1440 × 900" width={1440} height={900}>
                <AuthFrame device="desktop" {...sharedProps} kind="login" onSwitch={()=>goTo('02a Signup')}/>
              </DCArtboard>
              <DCArtboard id="login-m" label="Mobile · 390 × 844" width={390} height={844}>
                <AuthFrame device="mobile" {...sharedProps} kind="login" onSwitch={()=>goTo('02a Signup')}/>
              </DCArtboard>
            </DCSection>

            <DCSection id="signup" title="P2 · 注册 / Signup — 表单 + 验证码 + 同意条款">
              <DCArtboard id="signup-d" label="Desktop · 1440 × 900" width={1440} height={900}>
                <AuthFrame device="desktop" {...sharedProps} kind="signup" onSwitch={()=>goTo('02b Login')}/>
              </DCArtboard>
              <DCArtboard id="signup-m" label="Mobile · 390 × 844" width={390} height={844}>
                <AuthFrame device="mobile" {...sharedProps} kind="signup" onSwitch={()=>goTo('02b Login')}/>
              </DCArtboard>
            </DCSection>

            <DCSection id="onboarding" title="P4 · 引导 / Onboarding — 4 步分屏">
              <DCArtboard id="onb-1" label="Step 01 · 欢迎 · Desktop" width={1440} height={900}>
                <Onboarding device="desktop" {...sharedProps} step={1}/>
              </DCArtboard>
              <DCArtboard id="onb-2" label="Step 02 · 绑定 · Desktop" width={1440} height={900}>
                <Onboarding device="desktop" {...sharedProps} step={2}/>
              </DCArtboard>
              <DCArtboard id="onb-3" label="Step 03 · 偏好 · Desktop" width={1440} height={900}>
                <Onboarding device="desktop" {...sharedProps} step={3}/>
              </DCArtboard>
              <DCArtboard id="onb-4" label="Step 04 · 就绪 · Desktop" width={1440} height={900}>
                <Onboarding device="desktop" {...sharedProps} step={4}/>
              </DCArtboard>
              <DCArtboard id="onb-m" label="Mobile · Step 03 偏好" width={390} height={844}>
                <Onboarding device="mobile" {...sharedProps} step={3}/>
              </DCArtboard>
            </DCSection>

            <DCSection id="bind" title="P5 · 平台绑定 / Bind — 扫码 / 手机号 / Cookie 三 Tab">
              <DCArtboard id="bind-d" label="Desktop · 1440 × 900" width={1440} height={900}>
                <Bind device="desktop" {...sharedProps} onBack={()=>goTo('02c Onboarding 2/4')} onDone={()=>goTo('02 Home')}/>
              </DCArtboard>
              <DCArtboard id="bind-m" label="Mobile · 390 × 844" width={390} height={844}>
                <Bind device="mobile" {...sharedProps} onBack={()=>goTo('02c Onboarding 2/4')} onDone={()=>goTo('02 Home')}/>
              </DCArtboard>
            </DCSection>

            <DCSection id="home" title="P6 · 首页 / Home — 心情输入 + 启动电台">
              <DCArtboard id="home-d" label="Desktop · 1440 × 900" width={1440} height={900}>
                <Home device="desktop" {...sharedProps} onPlay={()=>goTo('03 Player')}/>
              </DCArtboard>
              <DCArtboard id="home-m" label="Mobile · 390 × 844" width={390} height={844}>
                <Home device="mobile" {...sharedProps} onPlay={()=>goTo('03 Player')}/>
              </DCArtboard>
            </DCSection>

            <DCSection id="player" title="P7 · 播放器 / Player — 沉浸式播放">
              <DCArtboard id="player-d" label="Desktop · 1440 × 900" width={1440} height={900}>
                <Player device="desktop" {...sharedProps} onBack={()=>goTo('02 Home')}/>
              </DCArtboard>
              <DCArtboard id="player-m" label="Mobile · 390 × 844" width={390} height={844}>
                <Player device="mobile" {...sharedProps} onBack={()=>goTo('02 Home')}/>
              </DCArtboard>
            </DCSection>

            <DCSection id="insights" title="P13 · 个人画像 / Insights — 情绪图鉴 & 周报">
              <DCArtboard id="insights-d" label="Desktop · 1440 × 900" width={1440} height={900}>
                <Insights device="desktop" {...sharedProps} onBack={()=>goTo('02 Home')}/>
              </DCArtboard>
              <DCArtboard id="insights-m" label="Mobile · 390 × 844" width={390} height={844}>
                <Insights device="mobile" {...sharedProps} onBack={()=>goTo('02 Home')}/>
              </DCArtboard>
            </DCSection>

            <DCSection id="calendar" title="P15 · 心情日历 / Calendar — 月视图 + 点击详情">
              <DCArtboard id="cal-d" label="Desktop · 1440 × 900" width={1440} height={900}>
                <MoodCalendar device="desktop" {...sharedProps} onBack={()=>goTo('02 Home')}/>
              </DCArtboard>
              <DCArtboard id="cal-m" label="Mobile · 390 × 844" width={390} height={844}>
                <MoodCalendar device="mobile" {...sharedProps} onBack={()=>goTo('02 Home')}/>
              </DCArtboard>
            </DCSection>

            <DCSection id="weekly" title="P14 · 周报详情 / Weekly Report + 长图分享">
              <DCArtboard id="weekly-d" label="Desktop · 1440 × 900" width={1440} height={900}>
                <WeeklyReport device="desktop" {...sharedProps} onBack={()=>goTo('04 Insights')}/>
              </DCArtboard>
              <DCArtboard id="weekly-m" label="Mobile · 390 × 844" width={390} height={844}>
                <WeeklyReport device="mobile" {...sharedProps} onBack={()=>goTo('04 Insights')}/>
              </DCArtboard>
              <DCArtboard id="weekly-share" label="分享长图 · Share Card 390 × 1480" width={390} height={1480}>
                <WeeklyReport device="mobile" {...sharedProps} mode="share"/>
              </DCArtboard>
            </DCSection>

            <DCSection id="playlist" title="P10 · 歌单详情 / Playlist Detail">
              <DCArtboard id="pl-d" label="Desktop · 1440 × 900" width={1440} height={900}>
                <PlaylistDetail device="desktop" {...sharedProps} onBack={()=>goTo('02 Home')} onPlay={()=>goTo('03 Player')}/>
              </DCArtboard>
              <DCArtboard id="pl-m" label="Mobile · 390 × 844" width={390} height={844}>
                <PlaylistDetail device="mobile" {...sharedProps} onBack={()=>goTo('02 Home')} onPlay={()=>goTo('03 Player')}/>
              </DCArtboard>
            </DCSection>
          </DesignCanvas>

          <TweaksPanel title="Tweaks · 调台">
            <TweakSection title="主题 · Theme">
              <TweakRadio
                value={theme}
                onChange={v => setTweak('theme', v)}
                options={[{value:'light', label:'明 Light'}, {value:'dark', label:'暗 Dark'}]}
              />
            </TweakSection>
            <TweakSection title="心情主色 · Mood Palette">
              <TweakSelect
                value={mood}
                onChange={v => setTweak('mood', v)}
                options={[
                  {value:'dusk', label:'Dusk · 黄昏 (peach / magenta / violet)'},
                  {value:'melancholy', label:'Melancholy · 蓝调忧郁'},
                  {value:'energetic', label:'Energetic · 高能炽烈'},
                  {value:'focused', label:'Focused · 专注青绿'},
                  {value:'calm', label:'Calm · 平静灰蓝'},
                ]}
              />
            </TweakSection>
            <TweakSection title="MoodWheel 几何 · Wheel Geometry">
              <TweakRadio
                value={wheelGeometry}
                onChange={v => setTweak('wheelGeometry', v)}
                options={[
                  {value:'circle', label:'圆形'},
                  {value:'square', label:'方形'},
                  {value:'blob', label:'流体'},
                ]}
              />
            </TweakSection>
          </TweaksPanel>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
